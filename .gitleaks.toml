paths = ['''^\.env\.example$''']
regexTarget = "secret"
regexes = ['''^thay-bang-chuoi-ky-32-ky-tu-tro-len$''']

[[allowlists]]
description = "Placeholder AUTH_RATE_LIMIT_SALT cu trong file mau"
condition = "AND"
targetRules = ["generic-api-key"]
