services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: meal_service
      POSTGRES_USER: meal_service
      POSTGRES_PASSWORD: local-compose-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meal_service -d meal_service"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: ["meal_service_db:/var/lib/postgresql/data"]
  migrate:
    build: { context: ., target: migrate }
    environment: { DATABASE_URL: "postgresql://meal_service:local-compose-only@db:5432/meal_service?schema=public" }
    depends_on: { db: { condition: service_healthy } }
    restart: "no"
  seed:
    build: { context: ., target: seed }
    environment: { DATABASE_URL: "postgresql://meal_service:local-compose-only@db:5432/meal_service?schema=public", DEMO_SEED: "1" }
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: "no"
  demo_bot:
    build: { context: ., target: seed }
    command: ["sh", "-c", "while true; do npm run db:seed:demo -w @suat-an/meal-service; sleep 21600; done"]
    environment: { DATABASE_URL: "postgresql://meal_service:local-compose-only@db:5432/meal_service?schema=public" }
    depends_on: { seed: { condition: service_completed_successfully } }
    restart: unless-stopped
  app:
    build: { context: ., target: app }
    environment: { DATABASE_URL: "postgresql://meal_service:local-compose-only@db:5432/meal_service?schema=public", DEMO_LOGIN_BUTTONS: "1", INSECURE_COOKIES: "1", EVIDENCE_STORAGE_DIR: "/app/uploads" }
    depends_on: { seed: { condition: service_completed_successfully } }
    ports: ["3000:3000"]
    volumes: ["meal_service_uploads:/app/uploads"]
    restart: unless-stopped
volumes:
  meal_service_db:
  meal_service_uploads:
