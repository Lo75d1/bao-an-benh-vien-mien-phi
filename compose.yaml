services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-meal_service}"
      POSTGRES_USER: "${POSTGRES_USER:-meal_service}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Hay dat POSTGRES_PASSWORD trong file .env}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: ["meal_service_db:/var/lib/postgresql/data"]
  migrate:
    build: { context: ., target: migrate }
    environment: { DATABASE_URL: "${DATABASE_URL:?Hay dat DATABASE_URL noi bo Docker trong file .env}" }
    depends_on: { db: { condition: service_healthy } }
    restart: "no"
  seed:
    build: { context: ., target: seed }
    environment:
      DATABASE_URL: "${DATABASE_URL:?Hay dat DATABASE_URL noi bo Docker trong file .env}"
      BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL:?Hãy đặt BOOTSTRAP_ADMIN_EMAIL trong file .env}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:?Hãy đặt BOOTSTRAP_ADMIN_PASSWORD trong file .env}"
      BOOTSTRAP_ADMIN_NAME: "${BOOTSTRAP_ADMIN_NAME:-Quản trị hệ thống}"
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: "no"
  app:
    build: { context: ., target: app }
    environment:
      DATABASE_URL: "${DATABASE_URL:?Hay dat DATABASE_URL noi bo Docker trong file .env}"
      EVIDENCE_STORAGE_DIR: "/app/uploads"
      PATIENT_NOTE_IP_SALT: "${PATIENT_NOTE_IP_SALT:?Hay dat PATIENT_NOTE_IP_SALT trong file .env}"
      AUTH_RATE_LIMIT_SALT: "${AUTH_RATE_LIMIT_SALT:?Hay dat AUTH_RATE_LIMIT_SALT trong file .env}"
    depends_on: { seed: { condition: service_completed_successfully } }
    ports: ["3000:3000"]
    volumes: ["meal_service_uploads:/app/uploads"]
    restart: unless-stopped
volumes:
  meal_service_db:
  meal_service_uploads:
